name: android-build

on:
  push:
    paths:
      - "android/**"
      - "noteditor/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "android/**"
      - "noteditor/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Sources into Android Project
        run: |
          mkdir -p android/app/src/main/python/noteditor
          cp -r noteditor/* android/app/src/main/python/noteditor/
          mkdir -p android/app/src/main/assets
          cp -r noteditor/static/* android/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotEditor-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk

