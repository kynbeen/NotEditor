name: android-build

on:
  push:
    paths:
      - "android/**"
      - "noteditor/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "android/**"
      - "noteditor/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Test shared Python engine
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests

      - name: Resolve version from tag or checkout
        run: |
          echo "NOTEDITOR_VERSION=$(python -c 'from noteditor.version import resolve_version; print(resolve_version())')" >> "$GITHUB_ENV"

      - name: Test and build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotEditor-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Verify Android release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noteditor-release.jks"

      - name: Build signed Android release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/noteditor-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Attach signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk

