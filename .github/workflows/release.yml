name: windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m noteditor.make_icon
      - run: python -m unittest discover -s tests
      # 태그에서 버전을 한 번만 정하고, 앱과 설치 파일이 그 값을 같이 쓴다.
      - name: Stamp version
        shell: pwsh
        run: |
          $version = python -m noteditor.stamp_version "${{ github.ref_name }}"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: pyinstaller --noconfirm NotEditor.spec
      - run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "installer\NotEditor.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: NotEditor-Windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          generate_release_notes: true
