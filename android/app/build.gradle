plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

def resolveNotEditorVersion = {
    def override = System.getenv('NOTEDITOR_VERSION')?.trim()
    if (override) {
        return override.replaceFirst('^v', '')
    }

    def process = new ProcessBuilder('git', 'describe', '--tags', '--always', '--dirty')
        .directory(rootProject.projectDir.parentFile)
        .redirectErrorStream(true)
        .start()
    def described = process.waitFor() == 0 ? process.inputStream.getText('UTF-8').trim() : ''
    def match = described =~ /^v?(\d+(?:\.\d+)*)(?:-(\d+)-g([0-9a-f]+))?(-dirty)?$/
    if (match.matches()) {
        def suffix = []
        if (match.group(2)) suffix << "${match.group(2)}.g${match.group(3)}"
        if (match.group(4)) suffix << 'dirty'
        return match.group(1) + (suffix ? "+${suffix.join('.')}" : '')
    }
    def commit = described.replaceAll('[^0-9a-z]', '')
    return "0.0.0+${commit ?: 'unknown'}"
}

def notEditorVersion = resolveNotEditorVersion()
def versionParts = notEditorVersion.split('\\+')[0].tokenize('.').collect { it as int }
while (versionParts.size() < 3) versionParts << 0
def notEditorVersionCode = Math.max(1, versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2])
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseSigning = releaseKeystore && System.getenv('ANDROID_KEYSTORE_PASSWORD') &&
    System.getenv('ANDROID_KEY_ALIAS') && System.getenv('ANDROID_KEY_PASSWORD')
def generatedPython = layout.buildDirectory.dir('generated/noteditor/python')
def generatedAssets = layout.buildDirectory.dir('generated/noteditor/assets')

android {
    namespace 'com.noteditor.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.noteditor.app"
        minSdk 24
        targetSdk 34
        versionCode notEditorVersionCode
        versionName notEditorVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            def abis = (project.findProperty("targetAbi") ?: "arm64-v8a,x86_64").split(",")
            abiFilters abis
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.setSrcDirs([generatedAssets])
            python.setSrcDirs([generatedPython])
        }
    }
}

def syncNotEditorPython = tasks.register('syncNotEditorPython', Sync) {
    from "${rootProject.projectDir}/../noteditor"
    into generatedPython.map { it.dir('noteditor') }
    exclude 'static/**', '__pycache__/**', '*.pyc'
    inputs.property('notEditorVersion', notEditorVersion)
    doLast {
        def versionFile = generatedPython.get().file('noteditor/_version.py').asFile
        versionFile.parentFile.mkdirs()
        versionFile.text = "\"\"\"Generated by the Android build.\"\"\"\n\n__version__ = \"${notEditorVersion}\"\n"
    }
}

def syncNotEditorAssets = tasks.register('syncNotEditorAssets', Sync) {
    from "${rootProject.projectDir}/../noteditor/static"
    into generatedAssets
}

tasks.named('preBuild').configure {
    dependsOn syncNotEditorPython, syncNotEditorAssets
}
tasks.matching { it.name.contains('PythonSources') }.configureEach {
    dependsOn syncNotEditorPython
}
tasks.matching { it.name.contains('Assets') && it.name != 'syncNotEditorAssets' }.configureEach {
    dependsOn syncNotEditorAssets
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "pillow"
            install "pypdf==6.16.2"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
