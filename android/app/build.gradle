plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.noteditor.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.noteditor.app"
        minSdk 24
        targetSdk 34
        versionCode 110
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            def abis = (project.findProperty("targetAbi") ?: "arm64-v8a,x86_64").split(",")
            abiFilters abis
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            python.srcDirs = ['src/main/python']
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "pillow"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // MuPDF 공식 Android 렌더링 엔진 AAR
    implementation 'com.artifex.mupdf:fitz:1.24.4'
}
